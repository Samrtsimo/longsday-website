<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Longsday Admin — 后台管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5; color: #1c1b19; line-height: 1.6;
}
.admin-header {
  background: #162d59; color: #fff;
  padding: 0.8rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
}
.admin-header h1 { font-size: 1.05rem; }
.admin-header a { color: rgba(255,255,255,0.7); font-size: 0.82rem; text-decoration: none; margin-left: 1rem; }
.admin-header a:hover,.admin-header a.active { color: #fff; }

.admin-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 1.5rem; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 8px rgba(0,0,0,0.04); }
.tab-btn {
  flex: 1; padding: 14px 20px; border: none; background: #fff;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  color: #888; border-bottom: 3px solid transparent; transition: all 0.2s;
}
.tab-btn.active { color: #162d59; border-bottom-color: #162d59; }
.tab-btn:hover:not(.active) { color: #46659b; background: #fafafa; }

/* Panels */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.panel {
  background: #fff; border-radius: 12px; padding: 1.5rem 2rem;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 1.5rem;
}
.panel h2 { font-size: 1.05rem; margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 2px solid #f0f0f0; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; color: #444; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 0.88rem; font-family: inherit; transition: border-color 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  outline: none; border-color: #46659b; box-shadow: 0 0 0 3px rgba(70,101,155,0.1);
}
.form-group textarea { resize: vertical; min-height: 100px; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 20px; border: none; border-radius: 20px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: #162d59; color: #fff; }
.btn-primary:hover { background: #1e3d73; }
.btn-secondary { background: #eee; color: #333; }
.btn-secondary:hover { background: #ddd; }
.btn-danger { background: #e74c3c; color: #fff; }
.btn-success { background: #27ae60; color: #fff; }
.btn-sm { padding: 5px 14px; font-size: 0.78rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }

.status { font-size: 0.82rem; margin-top: 0.4rem; }
.status.ok { color: #27ae60; } .status.err { color: #e74c3c; } .status.info { color: #46659b; }

/* Case list table */
.case-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.case-table th { text-align: left; padding: 10px 8px; border-bottom: 2px solid #eee; color: #888; font-weight: 600; font-size: 0.78rem; }
.case-table td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
.case-table tr:hover td { background: #f9fafb; }
.case-table .col-id { width: 90px; font-family: monospace; font-size: 0.78rem; }
.case-table .col-date { width: 75px; }
.case-table .col-tag { width: 80px; }
.case-table .col-title { }
.case-table .col-actions { width: 120px; text-align: right; }

/* API config inline */
.api-config { margin-bottom: 1rem; padding: 0.75rem 1rem; background: #fef9e7; border-radius: 8px; border: 1px solid #f0e6b0; font-size: 0.82rem; }
.api-config summary { cursor: pointer; font-weight: 600; color: #8a6d14; }
.api-config .api-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; align-items: end; flex-wrap: wrap; }
.api-config input { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.82rem; }

/* Publish bar */
.publish-bar {
  position: sticky; bottom: 0; background: #162d59; color: #fff;
  padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15); z-index: 100;
}
.publish-bar .changes-count { font-size: 0.85rem; }
.publish-bar .changes-count strong { color: #f9d64e; }

/* Login */
.login-overlay {
  position: fixed; inset: 0; background: #162d59;
  display: flex; align-items: center; justify-content: center; z-index: 9999;
}
.login-box {
  background: #fff; border-radius: 16px; padding: 3rem;
  width: 400px; max-width: 90vw; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-box h2 { margin-bottom: 0.5rem; color: #162d59; }
.login-box p { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
.login-box input {
  width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px;
  font-size: 1rem; text-align: center; font-family: inherit;
}
.login-box input:focus { outline: none; border-color: #46659b; }
.login-box .btn { margin-top: 1rem; width: 100%; justify-content: center; }

/* Toast */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  padding: 12px 24px; border-radius: 10px; color: #fff; font-weight: 600;
  font-size: 0.9rem; animation: toastIn 0.3s ease; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.success { background: #27ae60; }
.toast.error { background: #e74c3c; }
.toast.info { background: #46659b; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; z-index: 999;
}
.modal-box {
  background: #fff; border-radius: 14px; padding: 2rem;
  width: 420px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-box h3 { margin-bottom: 1rem; }
.modal-box .btn-row { justify-content: flex-end; }

@media (max-width: 768px) {
  .form-row { grid-template-columns: 1fr; }
  .case-table .col-id, .case-table .col-date { display: none; }
}
</style>
</head>
<body>

<!-- ========== Login Gate ========== -->
<div class="login-overlay" id="login-gate">
  <div class="login-box">
    <h2>🔐 Longsday 后台</h2>
    <p>请输入管理密码</p>
    <input type="password" id="login-pwd" placeholder="管理密码" autocomplete="off">
    <button class="btn btn-primary" onclick="doLogin()">进入后台</button>
    <div id="login-msg" style="margin-top:0.75rem;font-size:0.82rem;color:#e74c3c"></div>
  </div>
</div>

<!-- ========== Admin Shell ========== -->
<div id="admin-shell" style="display:none">

<header class="admin-header">
  <h1>📦 Longsday 后台管理</h1>
  <div>
    <a href="cases.html" target="_blank">查看案例页 →</a>
    <a href="index.html" target="_blank">首页 →</a>
    <a href="#" onclick="doLogout()">退出</a>
  </div>
</header>

<div class="admin-container">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-cases">📋 案例列表</button>
    <button class="tab-btn" data-tab="tab-edit">✏️ 新增/编辑案例</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ 设置</button>
  </div>

  <!-- Tab 1: Case List -->
  <div class="tab-panel active" id="tab-cases">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 style="margin:0;padding:0;border:none">所有案例（<span id="case-count">-</span>）</h2>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="loadCasesFromGitHub()">🔄 从 GitHub 刷新</button>
          <button class="btn btn-primary btn-sm" onclick="switchTab('tab-edit');clearEditForm()">＋ 新增案例</button>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="case-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-date">日期</th>
              <th class="col-tag">分类</th>
              <th class="col-title">标题</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="case-table-body">
            <tr><td colspan="5" style="text-align:center;color:#aaa;padding:3rem">点击「从 GitHub 刷新」加载案例</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab 2: Edit Case -->
  <div class="tab-panel" id="tab-edit">
    <div class="panel">
      <h2 id="edit-mode-title">✏️ 新增案例</h2>

      <!-- API Config -->
      <details class="api-config">
        <summary>⚙️ API 设置</summary>
        <div class="api-row">
          <input type="password" id="deepseek-key" placeholder="DeepSeek API Key (sk-...)">
          <button class="btn btn-secondary btn-sm" onclick="saveDeepSeekKey()">保存</button>
          <button class="btn btn-secondary btn-sm" onclick="testDeepSeekKey()">测试</button>
        </div>
        <span id="deepseek-status" style="font-size:0.75rem"></span>
      </details>

      <input type="hidden" id="edit-case-id">

      <div class="form-row">
        <div class="form-group" style="grid-column:span 2">
          <label>日期</label>
          <input type="text" id="case-date" placeholder="2026-06">
        </div>
        <div class="form-group">
          <label>分类标签 (英文)</label>
          <input type="text" id="case-tag-en" placeholder="Sea Freight">
        </div>
        <div class="form-group">
          <label>分类标签 (中文)</label>
          <input type="text" id="case-tag-zh" placeholder="海运">
        </div>
      </div>

      <div class="form-group">
        <label>标题 (中文) *</label>
        <input type="text" id="case-title-zh" placeholder="案例中文标题..." required>
      </div>
      <div class="form-group">
        <label>内容摘要 (中文) *</label>
        <textarea id="case-content-zh" placeholder="案例中文内容..." required></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="translateCase()" id="btn-translate">🌐 AI 翻译为英文</button>
        <button class="btn btn-secondary" onclick="clearEditForm()">清空</button>
      </div>
      <div id="translate-status" class="status"></div>

      <hr style="margin:1.5rem 0;border-color:#eee">

      <div class="form-group">
        <label>标题 (英文)</label>
        <input type="text" id="case-title-en" placeholder="English title...">
      </div>
      <div class="form-group">
        <label>内容摘要 (英文)</label>
        <textarea id="case-content-en" placeholder="English content..." style="min-height:80px"></textarea>
      </div>
      <div class="form-group">
        <label>图片</label>
        <input type="text" id="case-thumb" placeholder="assets/cases/case-xxx.jpg（多图用逗号分隔）">
      </div>

      <div class="btn-row" style="border-top:1px solid #eee;padding-top:1rem;margin-top:1rem">
        <button class="btn btn-success" onclick="saveCase()">💾 保存到本地暂存</button>
        <button class="btn btn-primary" onclick="saveAndPublish()">🚀 保存并发布</button>
        <span id="edit-status" class="status"></span>
      </div>
    </div>
  </div>

  <!-- Tab 3: Settings -->
  <div class="tab-panel" id="tab-settings">
    <div class="panel">
      <h2>🔧 设置</h2>
      <div class="form-group">
        <label>GitHub Token（用于自动发布）</label>
        <input type="password" id="github-token" placeholder="ghp_...">
        <p style="font-size:0.75rem;color:#888;margin-top:0.25rem">
          需要 <code>contents: write</code> 权限。Token 仅保存在本浏览器 localStorage。
        </p>
      </div>
      <button class="btn btn-primary" onclick="saveGitHubToken()">保存 Token</button>
      <span id="github-token-status" class="status"></span>
    </div>

    <div class="panel">
      <h2>📊 发布状态</h2>
      <div id="publish-log" style="font-size:0.82rem;color:#666;max-height:300px;overflow-y:auto">
        <p>— 暂无记录 —</p>
      </div>
    </div>
  </div>

</div>

<!-- Publish Bar -->
<div class="publish-bar" id="publish-bar" style="display:none">
  <div class="changes-count">
    📝 暂存区有 <strong id="staged-count">0</strong> 处修改待发布
  </div>
  <div>
    <button class="btn btn-secondary btn-sm" onclick="loadCasesFromGitHub()" style="background:rgba(255,255,255,0.2);color:#fff">放弃修改</button>
    <button class="btn btn-success btn-sm" onclick="publishAll()" id="btn-publish">🚀 发布到网站</button>
  </div>
</div>

</div><!-- /admin-shell -->

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal" style="display:none">
  <div class="modal-box">
    <h3>⚠️ 确认删除</h3>
    <p id="delete-msg" style="margin-bottom:1rem"></p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">取消</button>
      <button class="btn btn-danger" id="btn-confirm-delete">确认删除</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Longsday Admin v2 — GitHub API + DeepSeek + CRUD
   ============================================================ */
var ADMIN_PASSWORD = 'longsday2026';
var GITHUB_API = 'https://api.github.com/repos/Samrtsimo/longsday-website';
var CASES_PATH = 'data/cases.js';
var DEEPSEEK_API = 'https://api.deepseek.com/chat/completions';

// In-memory state
var cases = [];            // loaded from GitHub
var stagedCases = null;    // modified copy (null = no changes)
var currentEditId = null;

// ============================================================
//  LOGIN
// ============================================================
function doLogin() {
  var pwd = document.getElementById('login-pwd').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('admin-shell').style.display = 'block';
    loadSettings();
    logPublish('✅ 已登录后台');
  } else {
    document.getElementById('login-msg').textContent = '密码错误';
  }
}
function doLogout() {
  document.getElementById('admin-shell').style.display = 'none';
  document.getElementById('login-gate').style.display = 'flex';
  document.getElementById('login-pwd').value = '';
}

// ============================================================
//  SETTINGS
// ============================================================
function loadSettings() {
  var dk = localStorage.getItem('longsday_deepseek_key');
  if (dk) document.getElementById('deepseek-key').value = dk;
  var gt = localStorage.getItem('longsday_gh_token');
  if (gt) document.getElementById('github-token').value = gt;
}

function getGitHubToken() {
  return document.getElementById('github-token').value.trim() ||
         localStorage.getItem('longsday_gh_token') || '';
}

function saveGitHubToken() {
  var t = document.getElementById('github-token').value.trim();
  localStorage.setItem('longsday_gh_token', t);
  document.getElementById('github-token-status').textContent = '✅ Token 已保存';
  document.getElementById('github-token-status').className = 'status ok';
}

function getDeepSeekKey() {
  return document.getElementById('deepseek-key').value.trim() ||
         localStorage.getItem('longsday_deepseek_key') || '';
}
function saveDeepSeekKey() {
  var k = document.getElementById('deepseek-key').value.trim();
  localStorage.setItem('longsday_deepseek_key', k);
  document.getElementById('deepseek-status').textContent = '✅ 已保存';
  document.getElementById('deepseek-status').className = 'status ok';
}

// ============================================================
//  GITHUB API
// ============================================================
async function githubAPI(method, path, body) {
  var token = getGitHubToken();
  if (!token) throw new Error('请先在设置中配置 GitHub Token');
  var opts = {
    method: method,
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github+json'
    }
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  var resp = await fetch(GITHUB_API + '/contents/' + path, opts);
  if (!resp.ok) {
    var err = await resp.json().catch(function() { return {}; });
    throw new Error(err.message || 'HTTP ' + resp.status);
  }
  return resp.json();
}

function parseCasesJS(content) {
  // Decode base64
  var raw = atob(content);
  // Extract the array — find LONGSDAY_CASES = [ ... ];
  var match = raw.match(/LONGSDAY_CASES\s*=\s*(\[[\s\S]*?\n\]);/);
  if (!match) throw new Error('无法解析 cases.js 文件格式');
  // Use Function to safely parse the array literal
  var arr = (new Function('return ' + match[1]))();
  return arr;
}

function serializeCasesJS(casesArr) {
  var header = [
    '/* ============================================================',
    '   Longsday — Case Studies / News Data',
    '   ============================================================',
    '   To add a new case:',
    '     1. Add an entry to the CASES array below',
    '     2. Or use /admin.html to generate entries visually',
    '     3. Or run: python tools/upload_case.py your-file.docx',
    '   ============================================================ */',
    '',
    'var LONGSDAY_CASES = ['
  ].join('\n');

  var items = casesArr.map(function(c) {
    var parts = ['  {'];
    parts.push('    id: ' + JSON.stringify(c.id) + ',');
    if (c.date) parts.push('    date: ' + JSON.stringify(c.date) + ',');
    if (c.tag) parts.push('    tag: ' + JSON.stringify(c.tag) + ',');
    if (c.tagZh) parts.push('    tagZh: ' + JSON.stringify(c.tagZh) + ',');
    parts.push('    title: ' + JSON.stringify(c.title) + ',');
    parts.push('    titleZh: ' + JSON.stringify(c.titleZh) + ',');
    parts.push('    summary: ' + JSON.stringify(c.summary) + ',');
    parts.push('    summaryZh: ' + JSON.stringify(c.summaryZh) + ',');
    if (c.thumbs && c.thumbs.length) {
      parts.push('    thumbs: ' + JSON.stringify(c.thumbs));
    } else if (c.thumb) {
      parts.push('    thumb: ' + JSON.stringify(c.thumb));
    }
    parts.push('  },');
    return parts.join('\n');
  });

  return header + '\n' + items.join('\n') + '\n];\n';
}

async function loadCasesFromGitHub() {
  var status = document.getElementById('case-count');
  var tbody = document.getElementById('case-table-body');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem">⏳ 加载中...</td></tr>';

  try {
    var data = await githubAPI('GET', CASES_PATH);
    cases = parseCasesJS(data.content);
    stagedCases = null;
    currentEditId = null;
    renderCaseTable();
    updatePublishBar();
    toast('✅ 已从 GitHub 加载 ' + cases.length + ' 个案例', 'success');
    logPublish('📥 从 GitHub 加载 ' + cases.length + ' 个案例');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#e74c3c">❌ ' + e.message + '</td></tr>';
    toast('❌ 加载失败: ' + e.message, 'error');
  }
}

// ============================================================
//  CASE TABLE
// ============================================================
function renderCaseTable() {
  var arr = stagedCases || cases;
  var tbody = document.getElementById('case-table-body');
  document.getElementById('case-count').textContent = arr.length;

  if (!arr.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:3rem;color:#aaa">暂无案例</td></tr>';
    return;
  }

  tbody.innerHTML = arr.map(function(c, i) {
    return '<tr>' +
      '<td class="col-id"><code>' + esc(c.id) + '</code></td>' +
      '<td class="col-date">' + esc(c.date || '') + '</td>' +
      '<td class="col-tag"><span style="background:#eef;padding:2px 8px;border-radius:10px;font-size:0.75rem">' + esc(c.tagZh || c.tag || '') + '</span></td>' +
      '<td class="col-title">' + esc(c.titleZh || c.title || '').substring(0, 60) + '</td>' +
      '<td class="col-actions">' +
        '<button class="btn btn-secondary btn-sm" onclick="editCase(\'' + c.id + '\')">✏️</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="confirmDelete(\'' + c.id + '\')">🗑</button>' +
      '</td>' +
      '</tr>';
  }).join('');
}

function getWorkingCases() {
  return stagedCases || cases;
}

function updatePublishBar() {
  var bar = document.getElementById('publish-bar');
  var count = document.getElementById('staged-count');
  if (stagedCases) {
    bar.style.display = 'flex';
    count.textContent = '1';
  } else {
    bar.style.display = 'none';
  }
}

// ============================================================
//  EDIT CASE
// ============================================================
function editCase(id) {
  var arr = getWorkingCases();
  var c = arr.find(function(x) { return x.id === id; });
  if (!c) return;

  currentEditId = id;
  document.getElementById('edit-mode-title').textContent = '✏️ 编辑案例: ' + id;
  document.getElementById('edit-case-id').value = id;
  document.getElementById('case-date').value = c.date || '';
  document.getElementById('case-tag-en').value = c.tag || '';
  document.getElementById('case-tag-zh').value = c.tagZh || '';
  document.getElementById('case-title-zh').value = c.titleZh || '';
  document.getElementById('case-content-zh').value = c.summaryZh || '';
  document.getElementById('case-title-en').value = c.title || '';
  document.getElementById('case-content-en').value = c.summary || '';

  // Handle thumb/thumbs
  if (c.thumbs && c.thumbs.length) {
    document.getElementById('case-thumb').value = c.thumbs.join(', ');
  } else {
    document.getElementById('case-thumb').value = c.thumb || '';
  }

  switchTab('tab-edit');
  document.getElementById('edit-status').textContent = '';
}

function clearEditForm() {
  currentEditId = null;
  document.getElementById('edit-mode-title').textContent = '✏️ 新增案例';
  document.getElementById('edit-case-id').value = '';
  ['case-date','case-tag-en','case-tag-zh','case-title-zh','case-content-zh',
   'case-title-en','case-content-en','case-thumb'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  // Auto-fill date
  var now = new Date();
  document.getElementById('case-date').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  document.getElementById('edit-status').textContent = '';
}

function readCaseForm() {
  var titleZh = document.getElementById('case-title-zh').value.trim();
  var contentZh = document.getElementById('case-content-zh').value.trim();
  var titleEn = document.getElementById('case-title-en').value.trim();
  var contentEn = document.getElementById('case-content-en').value.trim();

  if (!titleZh || !contentZh) {
    alert('请至少填写中文标题和内容！');
    return null;
  }

  var thumbRaw = document.getElementById('case-thumb').value.trim();
  var c = {
    id: currentEditId || ('case-' + new Date().toISOString().slice(0,7).replace('-','') + '-' + Math.random().toString(36).substring(2, 6)),
    date: document.getElementById('case-date').value.trim(),
    tag: document.getElementById('case-tag-en').value.trim(),
    tagZh: document.getElementById('case-tag-zh').value.trim(),
    title: titleEn || titleZh,
    titleZh: titleZh,
    summary: contentEn || contentZh,
    summaryZh: contentZh
  };

  // Handle multiple images
  if (thumbRaw.includes(',')) {
    c.thumbs = thumbRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  } else if (thumbRaw) {
    c.thumb = thumbRaw;
  }

  return c;
}

function saveCase() {
  var c = readCaseForm();
  if (!c) return;

  var arr = getWorkingCases().slice(); // shallow copy
  if (currentEditId) {
    var idx = arr.findIndex(function(x) { return x.id === currentEditId; });
    if (idx >= 0) { arr[idx] = c; } else { arr.unshift(c); }
  } else {
    arr.unshift(c);
  }

  stagedCases = arr;
  currentEditId = c.id;
  document.getElementById('edit-case-id').value = c.id;
  document.getElementById('edit-mode-title').textContent = '✏️ 编辑案例: ' + c.id;
  document.getElementById('edit-status').textContent = '✅ 已暂存（待发布）';
  document.getElementById('edit-status').className = 'status ok';

  renderCaseTable();
  updatePublishBar();
  toast('💾 案例已暂存', 'info');
  logPublish('💾 暂存案例: ' + c.titleZh.substring(0, 40));
}

async function saveAndPublish() {
  var c = readCaseForm();
  if (!c) return;

  // First save to staged
  var arr = getWorkingCases().slice();
  if (currentEditId) {
    var idx = arr.findIndex(function(x) { return x.id === currentEditId; });
    if (idx >= 0) { arr[idx] = c; } else { arr.unshift(c); }
  } else {
    arr.unshift(c);
  }
  stagedCases = arr;
  currentEditId = c.id;

  // Then publish
  await publishAll();
}

// ============================================================
//  DELETE
// ============================================================
var pendingDeleteId = null;
function confirmDelete(id) {
  pendingDeleteId = id;
  var c = getWorkingCases().find(function(x) { return x.id === id; });
  document.getElementById('delete-msg').textContent = '确定删除案例「' + (c ? c.titleZh : id) + '」吗？此操作需发布后生效。';
  document.getElementById('delete-modal').style.display = 'flex';
  document.getElementById('btn-confirm-delete').onclick = function() {
    doDelete(id);
    closeModal('delete-modal');
  };
}

function doDelete(id) {
  var arr = getWorkingCases().slice();
  var idx = arr.findIndex(function(x) { return x.id === id; });
  if (idx >= 0) {
    arr.splice(idx, 1);
  }
  stagedCases = arr;
  renderCaseTable();
  updatePublishBar();
  toast('🗑 案例已标记删除（待发布）', 'info');
  logPublish('🗑 标记删除案例: ' + id);
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

// ============================================================
//  PUBLISH
// ============================================================
async function publishAll() {
  if (!stagedCases) {
    toast('没有待发布的修改', 'info');
    return;
  }

  var btn = document.getElementById('btn-publish');
  btn.disabled = true;
  btn.textContent = '⏳ 发布中...';

  try {
    var token = getGitHubToken();
    if (!token) throw new Error('请先在设置中配置 GitHub Token');

    // Get current file SHA
    var fileData = await githubAPI('GET', CASES_PATH);

    // Build new file content
    var newContent = serializeCasesJS(stagedCases);
    var base64Content = btoa(unescape(encodeURIComponent(newContent)));

    var commitMsg = 'admin: update cases (' + stagedCases.length + ' cases)';

    await githubAPI('PUT', CASES_PATH, {
      message: commitMsg,
      content: base64Content,
      sha: fileData.sha
    });

    // Success — update local state
    cases = stagedCases;
    stagedCases = null;
    currentEditId = null;
    renderCaseTable();
    updatePublishBar();
    clearEditForm();

    toast('🚀 发布成功！1-2分钟后网站更新', 'success');
    logPublish('🚀 发布成功: ' + commitMsg);
    btn.textContent = '🚀 发布到网站';
  } catch(e) {
    toast('❌ 发布失败: ' + e.message, 'error');
    logPublish('❌ 发布失败: ' + e.message);
    btn.textContent = '🚀 重试发布';
  }
  btn.disabled = false;
}

// ============================================================
//  DEEPSEEK TRANSLATE (kept from original)
// ============================================================
async function translateCase() {
  var titleZh = document.getElementById('case-title-zh').value.trim();
  var contentZh = document.getElementById('case-content-zh').value.trim();
  if (!titleZh || !contentZh) { alert('请先填写中文标题和内容！'); return; }

  var key = getDeepSeekKey();
  if (!key) { alert('请先设置 DeepSeek API Key！'); return; }

  var btn = document.getElementById('btn-translate');
  var status = document.getElementById('translate-status');
  btn.disabled = true; btn.textContent = '⏳ 翻译中...';
  status.textContent = '⏳ 调用 DeepSeek 翻译...'; status.className = 'status info';

  try {
    var titleEn = await translateText(key, '将以下中文标题翻译为专业、地道的英文（仅返回英文译文）:\n\n' + titleZh);
    var contentEn = await translateText(key,
      '将以下中文物流案例内容翻译为专业、地道的商务英文。专业术语如DDP、FBA、FCL、LCL等不翻译。仅返回英文译文:\n\n' + contentZh);

    document.getElementById('case-title-en').value = titleEn.trim();
    document.getElementById('case-content-en').value = contentEn.trim();
    status.textContent = '✅ 翻译完成，请检查微调。'; status.className = 'status ok';
    logPublish('🌐 AI翻译完成: ' + titleZh.substring(0, 40));
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.className = 'status err';
  }
  btn.disabled = false; btn.textContent = '🌐 AI 翻译为英文';
}

async function translateText(key, prompt) {
  var resp = await fetch(DEEPSEEK_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: '你是专业的中英翻译助手，擅长物流和国际贸易领域。只返回翻译结果，不要解释。' },
        { role: 'user', content: prompt }
      ],
      max_tokens: 2048, temperature: 0.3
    })
  });
  if (!resp.ok) {
    var e = await resp.json().catch(function() { return {}; });
    throw new Error(e.error?.message || 'HTTP ' + resp.status);
  }
  var data = await resp.json();
  return data.choices[0].message.content;
}

async function testDeepSeekKey() {
  var key = getDeepSeekKey();
  if (!key) { document.getElementById('deepseek-status').textContent = '❌ 请输入 Key'; return; }
  document.getElementById('deepseek-status').textContent = '⏳ 测试中...';
  try {
    var resp = await fetch(DEEPSEEK_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: 'Say ok' }], max_tokens: 10 })
    });
    if (resp.ok) {
      document.getElementById('deepseek-status').textContent = '✅ Key 有效';
      saveDeepSeekKey();
    } else {
      var e = await resp.json();
      document.getElementById('deepseek-status').textContent = '❌ ' + (e.error?.message || resp.status);
    }
  } catch(e) {
    document.getElementById('deepseek-status').textContent = '❌ 网络错误';
  }
}

// ============================================================
//  UI HELPERS
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelector('[data-tab="' + name + '"]').classList.add('active');
  document.getElementById(name).classList.add('active');
}

function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function logPublish(msg) {
  var logDiv = document.getElementById('publish-log');
  var time = new Date().toLocaleTimeString('zh-CN');
  if (logDiv.querySelector('p') && logDiv.querySelector('p').textContent === '— 暂无记录 —') {
    logDiv.innerHTML = '';
  }
  logDiv.innerHTML = '<p>[' + time + '] ' + msg + '</p>' + logDiv.innerHTML;
}

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  // Login enter key
  document.getElementById('login-pwd').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      switchTab(this.getAttribute('data-tab'));
    });
  });

  // Auto-fill date
  var now = new Date();
  document.getElementById('case-date').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

  // Close modal on overlay click
  document.getElementById('delete-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal('delete-modal');
  });
});
</script>
